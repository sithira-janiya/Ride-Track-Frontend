  <!-- skyline -->
  <g fill="#0B5FFF" fill-opacity=".1">
    <rect x="16" y="92" width="26" height="62" rx="3"/>
    <rect x="46" y="70" width="22" height="84" rx="3"/>
    <rect x="72" y="100" width="30" height="54" rx="3"/>
    <rect x="106" y="58" width="24" height="96" rx="3"/>
    <rect x="134" y="84" width="28" height="70" rx="3"/>
    <rect x="166" y="66" width="22" height="88" rx="3"/>
    <rect x="192" y="96" width="30" height="58" rx="3"/>
    <rect x="282" y="76" width="22" height="78" rx="3"/>
