  </g>
  <rect x="22" y="128" width="112" height="5" fill="#FFFFFF" fill-opacity=".35"/>
  <rect x="170" y="131" width="6" height="7" rx="2" fill="#FFC857"/>
  <rect x="24" y="131" width="5" height="8" rx="2" fill="#FF7A59"/>
  <circle cx="52" cy="148" r="11" fill="#26324D"/>
  <circle cx="52" cy="148" r="4.5" fill="#D6E4FF"/>
  <circle cx="146" cy="148" r="11" fill="#26324D"/>
  <circle cx="146" cy="148" r="4.5" fill="#D6E4FF"/>

