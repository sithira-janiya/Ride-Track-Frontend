  <rect x="8" y="152" width="304" height="10" rx="5" fill="#0B5FFF" fill-opacity=".22"/>
  <g fill="#FFFFFF" fill-opacity=".7">
    <rect x="184" y="156" width="14" height="2" rx="1"/>
    <rect x="292" y="156" width="12" height="2" rx="1"/>
  </g>

  <!-- bus -->
  <path d="M4 112h12M0 124h16M6 136h10" stroke="#0B5FFF" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
  <rect x="62" y="88" width="64" height="10" rx="4" fill="#0847BF"/>
  <rect x="22" y="94" width="156" height="54" rx="12" fill="#0B5FFF"/>
  <g fill="#D6E4FF">
    <rect x="32" y="103" width="22" height="19" rx="4"/>
    <rect x="58" y="103" width="22" height="19" rx="4"/>
    <rect x="84" y="103" width="22" height="19" rx="4"/>
    <rect x="110" y="103" width="22" height="19" rx="4"/>
    <rect x="138" y="103" width="14" height="38" rx="3"/>
