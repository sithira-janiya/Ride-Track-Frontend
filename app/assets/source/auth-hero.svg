  <rect x="212" y="22" width="72" height="138" rx="14" fill="#0847BF"/>
  <rect x="218" y="32" width="60" height="120" rx="9" fill="#FFFFFF"/>
  <rect x="238" y="26" width="20" height="3" rx="1.5" fill="#FFFFFF" fill-opacity=".45"/>
  <path d="M221 66h54M221 112h54M240 35v114M262 35v114" stroke="#E3ECFF" stroke-width="5" stroke-linecap="round"/>
  <path d="M228 140c0-22 22-20 20-44s14-24 14-34" fill="none" stroke="#0B5FFF" stroke-width="4" stroke-linecap="round" stroke-dasharray=".5 8"/>
  <circle cx="228" cy="140" r="5" fill="#FFFFFF" stroke="#0B5FFF" stroke-width="3"/>
  <circle cx="248" cy="100" r="10" fill="#0B5FFF"/>
  <rect x="243.5" y="94.5" width="9" height="10" rx="2" fill="#FFFFFF"/>
  <rect x="245" y="96" width="6" height="3.5" rx="1" fill="#0B5FFF"/>
  <circle cx="262" cy="50" r="15" fill="none" stroke="#FFB020" stroke-opacity=".4" stroke-width="2"/>
